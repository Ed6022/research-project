<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#0d2340">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">RP</span>
        <span><strong>{{ site.project.short_title }}</strong><small>{{ site.tagline }}</small></span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Overview</a>
        <a href="{{ '/objectives/' | relative_url }}">Objectives</a>
        <a href="{{ '/timeline/' | relative_url }}">Timeline</a>
        <a href="{{ '/literature/' | relative_url }}">Literature</a>
        <a href="{{ '/documents/' | relative_url }}">Documents</a>
        <a href="{{ '/outputs/' | relative_url }}">Outputs</a>
      </nav>
    </div>
  </header>

  <main class="shell main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <strong>{{ site.title }}</strong>
        <p>{{ site.project.affiliation }}</p>
      </div>
      <div>
        <span>Lead</span>
        <p>{{ site.project.lead }}</p>
      </div>
      <div>
        <span>Status</span>
        <p>{{ site.project.status }}</p>
      </div>
      <div>
        <span>Repository</span>
        <p><a href="{{ site.project.repository_url }}">GitHub</a></p>
      </div>
    </div>
  </footer>
</body>
</html>
